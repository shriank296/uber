services:
  uber_db:
    image: postgres:18
    container_name: uber-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: uber
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uber_db

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uber -d uber_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:            