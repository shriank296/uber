[project]
name = "uber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankur  Shrivastava", email = "ankurshrivastava@Ankurs-Mac-mini.local" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
uber = "uber:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "factory-boy>=3.3.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
addopts = ["-v","-ra","--cov=src --cov-report=term-missing --cov-branch"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"test_*.py" = ["S101"]

[tool.mypy]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
