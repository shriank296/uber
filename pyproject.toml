[project]
name = "uber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankur  Shrivastava", email = "ankurshrivastava@Ankurs-Mac-mini.local" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
uber = "uber:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
